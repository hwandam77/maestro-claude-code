# Maestro Claude Code - LiteLLM Fallback 설정
# Tailscale 미연결 시 사용. 자체 서버(nexus/cognit) 제외.
# GLM-5 + 클라우드 모델만 사용.
#
# 사용법:
#   litellm --config config/litellm-fallback.yaml --port 4000

model_list:

  # ─── 기본: GLM-5 ($3/월) ───
  - model_name: "glm-5"
    litellm_params:
      model: "openai/claude-sonnet-4-6"
      api_base: "https://api.z.ai/api/anthropic"
      api_key: "os.environ/ZAI_API_KEY"

  # ─── claude-sonnet-4-6 → GLM-5 ───
  - model_name: "claude-sonnet-4-6"
    litellm_params:
      model: "openai/claude-sonnet-4-6"
      api_base: "https://api.z.ai/api/anthropic"
      api_key: "os.environ/ZAI_API_KEY"

  # ─── haiku → GLM-5 (자체 서버 없으므로) ───
  - model_name: "claude-haiku-4-5-20251001"
    litellm_params:
      model: "openai/claude-sonnet-4-6"
      api_base: "https://api.z.ai/api/anthropic"
      api_key: "os.environ/ZAI_API_KEY"

  # ─── Gemini (무료 티어) ───
  - model_name: "gemini-3.1-pro"
    litellm_params:
      model: "gemini/gemini-2.0-flash"
      api_key: "os.environ/GOOGLE_API_KEY"

  # ─── Codex (구독) ───
  - model_name: "gpt-5.4-medium"
    litellm_params:
      model: "openai/gpt-4o"
      api_key: "os.environ/OPENAI_API_KEY"

  # ─── Claude 구독 (최종) ───
  - model_name: "claude-opus"
    litellm_params:
      model: "claude-opus-4-6"
      api_key: "os.environ/ANTHROPIC_API_KEY"

router_settings:
  fallbacks:
    - "claude-haiku-4-5-20251001":
        - "glm-5"

litellm_settings:
  request_timeout: 60
  drop_params: true

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  store_model_in_db: false
